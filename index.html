<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif;}
body{background:black;color:white;overflow-x:hidden;}

/* شاشة البداية */
.start-screen{
    position:fixed;
    width:100%;
    height:100%;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:999;
}

.start-btn{
    padding:15px 30px;
    border:none;
    border-radius:30px;
    background:#ff4d6d;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}
.start-btn:hover{transform:scale(1.1);}

/* نجوم */
.star{
    position:fixed;
    color:white;
    animation:floatUp linear infinite;
    opacity:0.5;
}

/* قلوب */
.heart{
    position:fixed;
    color:#ff4d6d;
    animation:floatUp linear infinite;
}

/* حركة الطلوع */
@keyframes floatUp{
    from{transform:translateY(0);}
    to{transform:translateY(-110vh);}
}

/* intro */
.intro{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.typewriter{
    border-right:3px solid white;
    white-space:nowrap;
    overflow:hidden;
    animation:typing 4s steps(40), blink 0.7s infinite;
}

@keyframes typing{from{width:0}to{width:100%}}
@keyframes blink{50%{border-color:transparent}}

/* gallery */
.gallery{
    padding:40px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:#111;
    border-radius:20px;
    overflow:hidden;
    transition:0.4s;
}
.card:hover{transform:scale(1.05);}

.card img{
    width:100%;
    height:300px;
    object-fit:cover;
}

.caption{
    padding:10px;
    text-align:center;
    font-size:14px;
}

/* flip */
.flip-container{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin:40px;
}

.flip-card{
    width:200px;
    height:200px;
    perspective:1000px;
}

.flip-inner{
    width:100%;
    height:100%;
    transition:0.6s;
    transform-style:preserve-3d;
}

.flip-card:hover .flip-inner{
    transform:rotateY(180deg);
}

.flip-front,.flip-back{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:15px;
    backface-visibility:hidden;
}

.flip-front{background:#222;}
.flip-back{background:#ff4d6d;transform:rotateY(180deg);}

/* counter */
.counter{
    text-align:center;
    margin:50px;
    font-size:1.5rem;
}
</style>
</head>

<body>

<!-- شاشة البداية -->
<div class="start-screen" id="startScreen">
    <button class="start-btn" onclick="startSite()">اضغط هنا ❤️</button>
</div>

<!-- intro -->
<div class="intro">
    <h1 class="typewriter">أنتِ أحلى حاجة في حياتي ❤️</h1>
</div>

<!-- صور -->
<div class="gallery">
    <div class="card">
        <img src="img1.jpg">
        <div class="caption">إيه الجمال ده بس 😂❤️</div>
    </div>

    <div class="card">
        <img src="img2.jpg">
        <div class="caption">واضح إن القمر بيغير منك 😂🌙</div>
    </div>
</div>

<!-- flip -->
<div class="flip-container">
    <div class="flip-card">
        <div class="flip-inner">
            <div class="flip-front">اضغط ❤️</div>
            <div class="flip-back">بحبك</div>
        </div>
    </div>

    <div class="flip-card">
        <div class="flip-inner">
            <div class="flip-front">اضغط ❤️</div>
            <div class="flip-back">أكتر</div>
        </div>
    </div>
</div>

<!-- العداد -->
<div class="counter">
    <span id="time"></span> ❤️
</div>

<!-- ميوزيك -->
<audio id="music" loop>
    <source src="music.mp3">
</audio>

<script>

// بدء الموقع
function startSite(){
    document.getElementById("startScreen").style.display="none";

    let music = document.getElementById("music");
    music.play();
    music.volume = 0;

    let fade = setInterval(()=>{
        if(music.volume < 1){
            music.volume += 0.05;
        }else clearInterval(fade);
    },300);
}

// العداد (19/3/2025 6:30)
let startDate = new Date("2025-03-19T18:30:00");

setInterval(()=>{
    let now = new Date();
    let diff = now - startDate;

    let days = Math.floor(diff/(1000*60*60*24));
    let hours = Math.floor((diff/(1000*60*60))%24);
    let mins = Math.floor((diff/(1000*60))%60);

    document.getElementById("time").innerText =
        days+" يوم "+hours+" ساعة "+mins+" دقيقة";
},1000);

// قلوب ونجوم عشوائي بطيء
setInterval(()=>{
    let el = document.createElement("div");

    if(Math.random() > 0.5){
        el.innerText="❤️";
        el.classList.add("heart");
    }else{
        el.innerText="★";
        el.classList.add("star");
    }

    el.style.left = Math.random()*100+"vw";
    el.style.fontSize = (Math.random()*15+10)+"px";
    el.style.animationDuration = (Math.random()*10+8)+"s";

    document.body.appendChild(el);

    setTimeout(()=>{el.remove()},15000);

},800);

</script>

</body>
  </html>
